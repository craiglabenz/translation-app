<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Babble — Live Bilingual Speech & Currency Translator powered by Gemma 4 & Gemini.">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS & mobile PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Babble">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Babble — Gemma 4 Translator</title>
  <link rel="manifest" href="manifest.json">

  <!-- LiteRT-LM Web Inference for .litertlm models via WebGPU/WASM -->
  <script type="module">
  window.litertLmReady = (async () => {
    try {
      const m = await import('https://cdn.jsdelivr.net/npm/@litert-lm/core@0.18.0/+esm');
      window.Engine = m.Engine;
      window.EmbeddingEngine = m.EmbeddingEngine;
      return m.Engine;
    } catch (e) {
      console.warn('LiteRT-LM web runtime failed to load from CDN:', e);
      return null;
    }
  })();
  </script>

  <!-- flutter_edge_ai Cache API & OPFS helpers for persistent browser storage -->
  <script src="cache_api.js"></script>
  <script src="opfs_helper.js"></script>

  <!-- LiteRT.js Embeddings -->
  <script type="module" src="litert_embeddings.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
