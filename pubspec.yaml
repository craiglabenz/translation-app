name: translation_app
description: A new Flutter project with Serverpod.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: "^3.13.0"
  flutter: "^3.44.4"

dependencies:
  bloc_signals: ^1.0.1
  bloc_signals_flutter: ^1.2.0
  cupertino_icons: ^1.0.5
  cupertino_ui: ^1.1.4
  data_layer: ^0.0.8
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  google_fonts: ^8.1.0
  injectable: ^3.0.0
  json_annotation: ^4.12.0
