  material_ui: ^1.8.0

dev_dependencies:
  build_runner: ^2.16.0
  flutter_driver:
    sdk: flutter
  flutter_lints: ">=3.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1

dependency_overrides:
