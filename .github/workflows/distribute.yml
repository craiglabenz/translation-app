name: Build & Distribute (Firebase Hosting & App Distribution)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform(s) to build & distribute"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - web
          - android
          - ios
          - both
      distribute:
        description: "Upload/deploy built artifacts to Firebase"
        required: true
        default: true
        type: boolean
      firebase_groups:
        description: "Comma-separated Firebase tester groups (optional override)"
        required: false
        default: ""
        type: string
      release_notes:
        description: "Custom release notes (defaults to latest git commits)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze & Test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Dart changes (pubspec.yaml, lib/**, test/**)
        id: dart-changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(pubspec\.yaml|lib/|test/)'; then
            echo "Detected changes in Dart files."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in pubspec.yaml, lib/**, test/**; skipping analyze & tests."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.dart-changes.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run dart analyze & flutter test
        if: steps.dart-changes.outputs.changed == 'true'
        run: ./scripts/test_and_analyze.sh

  build-web:
    name: Build & Deploy Web Release (Firebase Hosting)
    needs: verify
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'web' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter Web Release
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./scripts/build_web.sh

      - name: Upload Web bundle artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: web-release-bundle
          path: build/web

      - name: Deploy Web Release to Firebase Hosting
        if: ${{ github.event_name == 'push' || inputs.distribute }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          if [[ -z "${FIREBASE_TOKEN}" && -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "ℹ️ FIREBASE_TOKEN secret is not set; skipping Firebase Hosting deployment."
            exit 0
          fi
          npm install -g firebase-tools
          ./scripts/distribute_firebase.sh --platform web

  build-android:
    name: Build & Distribute Android Release
    needs: verify
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android Release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build_android.sh --apk

      - name: Upload APK artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Distribute Android APK to Firebase App Distribution
        if: ${{ github.event_name == 'push' || inputs.distribute }}
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          INPUT_FIREBASE_GROUPS: ${{ inputs.firebase_groups }}
          SECRET_FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [[ -z "${FIREBASE_ANDROID_APP_ID}" ]]; then
            echo "ℹ️ FIREBASE_ANDROID_APP_ID secret is not set; skipping Android Firebase App Distribution."
            exit 0
          fi
          export FIREBASE_GROUPS="${INPUT_FIREBASE_GROUPS:-${SECRET_FIREBASE_GROUPS}}"
          npm install -g firebase-tools
          ./scripts/distribute_firebase.sh --platform android

  build-ios:
    name: Build & Distribute iOS Release
    needs: verify
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build iOS Release (Signed IPA when signing secrets are present, unsigned otherwise)
        id: ios-build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SECRET_IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          export APPLE_TEAM_ID="${SECRET_APPLE_TEAM_ID:-KNK9SM7SLS}"
          export IOS_BUNDLE_ID="${SECRET_IOS_BUNDLE_ID:-com.craiglabenz.babble}"
          if [[ -n "${IOS_P12_BASE64}" && -n "${IOS_PROVISIONING_PROFILE_BASE64}" ]]; then
            ./scripts/build_ios.sh --export-method ad-hoc
            echo "signed_ipa=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ iOS signing secrets (IOS_P12_BASE64 / IOS_PROVISIONING_PROFILE_BASE64) not configured; building unsigned release bundle."
            ./scripts/build_ios.sh --no-codesign
            echo "signed_ipa=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload iOS IPA artifact to GitHub Actions
        if: steps.ios-build.outputs.signed_ipa == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa

      - name: Distribute iOS IPA to Firebase App Distribution
        if: ${{ (github.event_name == 'push' || inputs.distribute) && steps.ios-build.outputs.signed_ipa == 'true' }}
        env:
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          INPUT_FIREBASE_GROUPS: ${{ inputs.firebase_groups }}
          SECRET_FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [[ -z "${FIREBASE_IOS_APP_ID}" ]]; then
            echo "ℹ️ FIREBASE_IOS_APP_ID secret is not set; skipping iOS Firebase App Distribution."
            exit 0
          fi
          export FIREBASE_GROUPS="${INPUT_FIREBASE_GROUPS:-${SECRET_FIREBASE_GROUPS}}"
          npm install -g firebase-tools
          ./scripts/distribute_firebase.sh --platform ios
