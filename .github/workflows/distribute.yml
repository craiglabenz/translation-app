name: Build & Distribute (Firebase App Distribution)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform(s) to build & distribute"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - android
          - ios
      distribute:
        description: "Upload built artifacts to Firebase App Distribution"
        required: true
        default: true
        type: boolean
      firebase_groups:
        description: "Comma-separated Firebase tester groups (optional override)"
        required: false
        default: ""
        type: string
      release_notes:
        description: "Custom release notes (defaults to latest git commits)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze & Test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Dart changes (pubspec.yaml, lib/**, test/**)
        id: dart-changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(pubspec\.yaml|lib/|test/)'; then
            echo "Detected changes in Dart files."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in pubspec.yaml, lib/**, test/**; skipping analyze & tests."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.dart-changes.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run dart analyze & flutter test
        if: steps.dart-changes.outputs.changed == 'true'
        run: ./scripts/test_and_analyze.sh

  build-android:
    name: Build & Distribute Android Release
    needs: verify
    if: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android Release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build_android.sh --apk

      - name: Upload APK artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Distribute Android APK to Firebase App Distribution
        if: ${{ (github.event_name == 'push' || inputs.distribute) && secrets.FIREBASE_ANDROID_APP_ID != '' }}
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_GROUPS: ${{ inputs.firebase_groups != '' && inputs.firebase_groups || secrets.FIREBASE_GROUPS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          npm install -g firebase-tools
          ./scripts/distribute_firebase.sh --platform android

  build-ios:
    name: Build & Distribute iOS Release
    needs: verify
    if: ${{ github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build iOS Release (Signed IPA when signing secrets are present, unsigned otherwise)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_TEAM_ID || 'KNK9SM7SLS' }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID != '' && secrets.IOS_BUNDLE_ID || 'com.craiglabenz.babble' }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [[ -n "${IOS_P12_BASE64}" && -n "${IOS_PROVISIONING_PROFILE_BASE64}" ]]; then
            ./scripts/build_ios.sh --export-method ad-hoc
          else
            echo "ℹ️ iOS signing secrets (IOS_P12_BASE64 / IOS_PROVISIONING_PROFILE_BASE64) not configured; building unsigned release bundle."
            ./scripts/build_ios.sh --no-codesign
          fi

      - name: Upload iOS IPA artifact to GitHub Actions
        if: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa

      - name: Distribute iOS IPA to Firebase App Distribution
        if: ${{ (github.event_name == 'push' || inputs.distribute) && secrets.FIREBASE_IOS_APP_ID != '' && secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_GROUPS: ${{ inputs.firebase_groups != '' && inputs.firebase_groups || secrets.FIREBASE_GROUPS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          npm install -g firebase-tools
          ./scripts/distribute_firebase.sh --platform ios
